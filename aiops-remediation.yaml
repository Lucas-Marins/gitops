---
- name: AIOps - Diagnostico e Remediacao com LLM
  hosts: localhost
  gather_facts: false
  vars:
    llm_endpoint: "https://ollama-route-aiops-llm.apps.cluster-wnx6z.dynamic.redhatworkshops.io/v1/chat/completions"
    llm_model: "mistral:7b"

  tasks:
    # 1. Validar variaveis do evento
    - name: Validar variaveis
      ansible.builtin.fail:
        msg: "event_alert_name ou event_namespace nao definidos"
      when: event_alert_name is not defined or event_namespace is not defined

    - name: Mostrar incidente
      ansible.builtin.debug:
        msg: |
          INCIDENTE: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Descricao: {{ event_description | default('N/A') }}

    # 2. Coletar logs do pod via kubernetes.core (usa a credential do AAP)
    - name: Coletar logs do pod
      kubernetes.core.k8s_log:
        name: "{{ event_pod }}"
        namespace: "{{ event_namespace }}"
        kind: Pod
      register: pod_logs
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    # 3. Coletar detalhes do pod via k8s_info
    - name: Coletar informacoes do pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ event_pod }}"
        namespace: "{{ event_namespace }}"
      register: pod_info
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Extrair descricao do pod
      ansible.builtin.set_fact:
        pod_describe: "{{ pod_info.resources[0] | to_nice_yaml | default('N/A') }}"

    # 4. Descobrir deployment pai via ownerReferences
    - name: Descobrir deployment pai
      ansible.builtin.set_fact:
        parent_deployment: "{% if pod_info.resources | length > 0 %}{{ pod_info.resources[0].metadata.ownerReferences | selectattr('kind', 'equalto', 'ReplicaSet') | map(attribute='name') | first | default('') | regex_replace('-[a-z0-9]+$', '') }}{% else %}N/A{% endif %}"
      when: pod_info is succeeded and pod_info.resources is defined

    - name: Mostrar deployment encontrado
      ansible.builtin.debug:
        msg: "Deployment pai: {{ parent_deployment | default('NAO ENCONTRADO') }}"

    # 5. Montar prompt para o LLM
    - name: Montar prompt
      ansible.builtin.set_fact:
        llm_prompt: |
          Voce e um SRE especialista em OpenShift.
          Analise o incidente e responda EXATAMENTE neste formato:

          CAUSA_RAIZ: <uma linha>
          ACAO_REMEDIACAO: <comando oc ou kubectl exato>
          PLAYBOOK_SUGERIDO: <YAML ansible minimo>

          DADOS DO INCIDENTE:
          - Alerta: {{ event_alert_name }}
          - Namespace: {{ event_namespace }}
          - Pod: {{ event_pod | default('N/A') }}
          - Severidade: {{ event_severity }}
          - Descricao: {{ event_description | default('N/A') }}
          - Deployment: {{ parent_deployment | default('N/A') }}

          LOGS DO POD:
          {{ pod_logs.log | default('N/A') }}

          DETALHES DO POD (status, restarts, events):
          {{ pod_describe | truncate(2000) }}

    # 6. Consultar LLM
    - name: Consultar IA para diagnostico
      ansible.builtin.uri:
        url: "{{ llm_endpoint }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          model: "{{ llm_model }}"
          messages:
            - role: system
              content: "Voce e um engenheiro SRE. Responda apenas no formato solicitado."
            - role: user
              content: "{{ llm_prompt }}"
          temperature: 0.1
          max_tokens: 2000
        status_code: 200
        timeout: 180
      register: llm_response

    - name: Extrair diagnostico
      ansible.builtin.set_fact:
        ai_diagnosis: "{{ llm_response.json.choices[0].message.content }}"

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: |
          🤖 DIAGNOSTICO DA IA:
          {{ ai_diagnosis }}

    # 7. Salvar auditoria
    - name: Salvar relatorio
      ansible.builtin.copy:
        content: |
          === AIOps Report ===
          Data: {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}
          Alerta: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Deployment: {{ parent_deployment | default('N/A') }}

          === Diagnostico IA ===
          {{ ai_diagnosis }}
        dest: "/tmp/aiops_{{ event_alert_name | replace(' ', '_') }}_{{ event_namespace }}.txt"

    # 8. REMEDIACAO AUTOMATICA (critical) via kubernetes.core
    - name: Executar remediacao automatica
      block:
        - name: Rollout restart deployment via patch
          kubernetes.core.k8s:
            state: patched
            api_version: apps/v1
            kind: Deployment
            name: "{{ parent_deployment }}"
            namespace: "{{ event_namespace }}"
            definition:
              spec:
                template:
                  metadata:
                    annotations:
                      kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
          when: parent_deployment | default('') | length > 0 and parent_deployment != 'N/A'
          ignore_errors: true

        - name: Ou deletar pod diretamente (fallback)
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Pod
            name: "{{ event_pod }}"
            namespace: "{{ event_namespace }}"
          when: parent_deployment | default('') | length == 0 or parent_deployment == 'N/A'

        - name: Notificar sucesso
          ansible.builtin.debug:
            msg: "✅ Remediacao executada para {{ event_alert_name }} em {{ event_namespace }}"
      when: event_severity == "critical"