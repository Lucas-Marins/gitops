---
- name: AIOps - Diagnostico e Remediacao com LLM
  hosts: localhost
  gather_facts: false
  vars:
    llm_endpoint: "https://ollama-route-aiops-llm.apps.cluster-dlpnc.dynamic.redhatworkshops.io/v1/chat/completions"
    llm_model: "phi3:mini"
    report_dir: "/tmp/aiops_reports"
    llm_available: true

  tasks:
    # ============================================================
    # 1. VALIDACAO
    # ============================================================
    - name: Validar variaveis do evento
      ansible.builtin.fail:
        msg: "event_alert_name ou event_namespace nao definidos"
      when: event_alert_name is not defined or event_namespace is not defined

    - name: Criar diretorio de relatorios
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Mostrar incidente recebido
      ansible.builtin.debug:
        msg: |
          INCIDENTE: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Descricao: {{ event_description | default('N/A') }}

    # ============================================================
    # 2. COLETA DE DADOS
    # ============================================================
    - name: Coletar logs do pod
      kubernetes.core.k8s_log:
        name: "{{ event_pod }}"
        namespace: "{{ event_namespace }}"
        kind: Pod
      register: pod_logs
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Coletar informacoes do pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ event_pod }}"
        namespace: "{{ event_namespace }}"
      register: pod_info
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Extrair descricao do pod
      ansible.builtin.set_fact:
        pod_describe: "{{ pod_info.resources[0] | to_nice_yaml | default('N/A') }}"

    - name: Descobrir deployment pai
      ansible.builtin.set_fact:
        parent_deployment: "{% if pod_info.resources | length > 0 %}{{ pod_info.resources[0].metadata.ownerReferences | selectattr('kind', 'equalto', 'ReplicaSet') | map(attribute='name') | first | default('') | regex_replace('-[a-z0-9]+$', '') }}{% else %}N/A{% endif %}"
      when: pod_info is succeeded and pod_info.resources is defined

    - name: Coletar eventos do namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Event
        namespace: "{{ event_namespace }}"
      register: namespace_events
      ignore_errors: true

    - name: Coletar status do deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ parent_deployment }}"
        namespace: "{{ event_namespace }}"
      register: deployment_status
      ignore_errors: true
      when: parent_deployment | default('') | length > 0 and parent_deployment != 'N/A'

    - name: Mostrar deployment encontrado
      ansible.builtin.debug:
        msg: "Deployment pai: {{ parent_deployment | default('NAO ENCONTRADO') }}"

    # ============================================================
    # 3. TENTAR CONSULTAR IA (com timeout e fallback)
    # ============================================================
    - name: Consultar IA para diagnostico
      ansible.builtin.uri:
        url: "{{ llm_endpoint }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          model: "{{ llm_model }}"
          messages:
            - role: system
              content: "Voce e um engenheiro SRE senior. Responda apenas no formato solicitado. Seja tecnico e preciso."
            - role: user
              content: |
                Voce e um SRE senior especialista em OpenShift/Kubernetes.
                Analise o incidente e responda EXATAMENTE no formato:

                CAUSA_RAIZ: <diagnostico>
                CONFIANCA: <alta/media/baixa>
                ACAO_REMEDIACAO: <comando oc/kubectl>
                RISCO_REMEDIACAO: <nivel>

                DADOS:
                - Alerta: {{ event_alert_name }}
                - Namespace: {{ event_namespace }}
                - Pod: {{ event_pod | default('N/A') }}
                - Severidade: {{ event_severity }}
                - Deployment: {{ parent_deployment | default('N/A') }}
                - Logs: {{ pod_logs.log | default('N/A') | truncate(2000) }}
                - Status: {{ pod_describe | truncate(1500) }}
          temperature: 0.1
          max_tokens: 1000
          stream: false
        status_code: 200
        timeout: 180
        validate_certs: false
      register: llm_response
      retries: 2
      delay: 10
      until: llm_response.status == 200
      ignore_errors: true

    - name: Verificar se LLM respondeu
      ansible.builtin.set_fact:
        llm_available: "{{ llm_response.status is defined and llm_response.status == 200 }}"

    - name: Extrair diagnostico da IA
      block:
        - name: Extrair resposta bruta
          ansible.builtin.set_fact:
            ai_raw_response: "{{ llm_response.json.choices[0].message.content }}"

        - name: Extrair CAUSA_RAIZ
          ansible.builtin.set_fact:
            ai_causa_raiz: "{{ (ai_raw_response | regex_search('CAUSA_RAIZ:\s*(.+)', '\1') | default(['NAO IDENTIFICADA'], true)) | first }}"

        - name: Extrair CONFIANCA
          ansible.builtin.set_fact:
            ai_confianca: "{{ (ai_raw_response | regex_search('CONFIANCA:\s*(\w+)', '\1') | default(['baixa'], true)) | first }}"

        - name: Extrair ACAO_REMEDIACAO
          ansible.builtin.set_fact:
            ai_acao: "{{ (ai_raw_response | regex_search('ACAO_REMEDIACAO:\s*(.+)', '\1') | default(['N/A'], true)) | first }}"

        - name: Extrair RISCO_REMEDIACAO
          ansible.builtin.set_fact:
            ai_risco: "{{ (ai_raw_response | regex_search('RISCO_REMEDIACAO:\s*(.+)', '\1') | default(['N/A'], true)) | first }}"

        - name: Extrair EXPLICACAO
          ansible.builtin.set_fact:
            ai_explicacao: "{{ (ai_raw_response | regex_search('EXPLICACAO:\s*(.+)', '\1') | default(['N/A'], true)) | first }}"
      when: llm_available

    - name: Diagnostico fallback (IA indisponivel)
      ansible.builtin.set_fact:
        ai_causa_raiz: "IA indisponivel - analise baseada em heuristica"
        ai_confianca: "media"
        ai_acao: "oc rollout restart deployment/{{ parent_deployment }} -n {{ event_namespace }}"
        ai_risco: "baixo - restart de deployment e operacao padrao"
        ai_explicacao: "O pod {{ event_pod | default('N/A') }} apresenta falha. Como a IA nao esta disponivel, a acao recomendada e restart do deployment."
      when: not llm_available

    # ============================================================
    # 4. MOSTRAR RESULTADO
    # ============================================================
    - name: Mostrar diagnostico
      ansible.builtin.debug:
        msg: |
          ============================================================
          {% if llm_available %}🤖 DIAGNOSTICO DA IA{% else %}⚠️ DIAGNOSTICO FALLBACK (IA indisponivel){% endif %}
          ============================================================
          CAUSA RAIZ:    {{ ai_causa_raiz }}
          CONFIANCA:     {{ ai_confianca }}
          ACAO MANUAL:   {{ ai_acao }}
          RISCO:         {{ ai_risco }}
          ------------------------------------------------------------
          EXPLICACAO:
          {{ ai_explicacao }}

    # ============================================================
    # 5. SALVAR RELATORIO
    # ============================================================
    - name: Salvar relatorio
      ansible.builtin.copy:
        content: |
          === AIOps Report ===
          Data: {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}
          Alerta: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Deployment: {{ parent_deployment | default('N/A') }}
          IA disponivel: {{ llm_available }}

          === Diagnostico ===
          Causa Raiz: {{ ai_causa_raiz }}
          Confianca: {{ ai_confianca }}
          Risco: {{ ai_risco }}

          === Explicacao ===
          {{ ai_explicacao }}

          === Acao ===
          {{ ai_acao }}
        dest: "{{ report_dir }}/aiops_{{ event_alert_name | replace(' ', '_') | regex_replace('[^a-zA-Z0-9_]', '') }}_{{ event_namespace }}_{{ ansible_date_time.epoch | default(lookup('pipe', 'date +%s')) }}.txt"

    # ============================================================
    # 6. REMEDIACAO AUTOMATICA (critical)
    # ============================================================
    - name: Remediacao automatica
      block:
        - name: Rollout restart deployment
          kubernetes.core.k8s:
            state: patched
            api_version: apps/v1
            kind: Deployment
            name: "{{ parent_deployment }}"
            namespace: "{{ event_namespace }}"
            definition:
              spec:
                template:
                  metadata:
                    annotations:
                      kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
          when: parent_deployment | default('') | length > 0 and parent_deployment != 'N/A'

        - name: Aguardar rollout
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            name: "{{ parent_deployment }}"
            namespace: "{{ event_namespace }}"
          register: deploy_status
          until: deploy_status.resources[0].status.readyReplicas | default(0) == deploy_status.resources[0].spec.replicas | default(1)
          retries: 12
          delay: 10
          when: parent_deployment | default('') | length > 0 and parent_deployment != 'N/A'

        - name: Deletar pod
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Pod
            name: "{{ event_pod }}"
            namespace: "{{ event_namespace }}"
          when: parent_deployment | default('') | length == 0 or parent_deployment == 'N/A'

        - name: Notificar
          ansible.builtin.debug:
            msg: "✅ Remediacao executada para {{ event_alert_name }} em {{ event_namespace }}"
      when: event_severity == "critical"