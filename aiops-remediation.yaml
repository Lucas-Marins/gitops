---
- name: AIOps - Diagnostico e Remediacao com LLM
  hosts: localhost
  gather_facts: false
  vars:
    llm_endpoint: "https://ollama-route-aiops-llm.apps.cluster-dtfl9.dynamic.redhatworkshops.io//v1/chat/completions"
    llm_model: "mistral:7b"
    k8s_api: "https://kubernetes.default.svc.cluster.local:443"
    k8s_token_path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    k8s_ca_path: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  tasks:
    # 1. Validar variaveis do evento
    - name: Validar variaveis
      ansible.builtin.fail:
        msg: "event_alert_name ou event_namespace nao definidos"
      when: event_alert_name is not defined or event_namespace is not defined

    - name: Mostrar incidente
      ansible.builtin.debug:
        msg: |
          🚨 INCIDENTE: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Descricao: {{ event_description | default('N/A') }}

    # 2. Ler token do service account do pod
    - name: Ler token do service account
      ansible.builtin.slurp:
        src: "{{ k8s_token_path }}"
      register: sa_token
      no_log: true

    - name: Set fact token
      ansible.builtin.set_fact:
        k8s_token: "{{ sa_token.content | b64decode }}"

    # 3. Coletar logs do pod via API REST
    - name: Coletar logs do pod via API Kubernetes
      ansible.builtin.uri:
        url: "{{ k8s_api }}/api/v1/namespaces/{{ event_namespace }}/pods/{{ event_pod }}/log?tailLines=50"
        method: GET
        headers:
          Authorization: "Bearer {{ k8s_token }}"
        validate_certs: true
        ca_path: "{{ k8s_ca_path }}"
        status_code: 200
      register: pod_logs_api
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Set fact logs
      ansible.builtin.set_fact:
        pod_logs: "{{ pod_logs_api.content | default('N/A') }}"

    # 4. Coletar descricao/detalhes do pod via API REST
    - name: Coletar detalhes do pod via API Kubernetes
      ansible.builtin.uri:
        url: "{{ k8s_api }}/api/v1/namespaces/{{ event_namespace }}/pods/{{ event_pod }}"
        method: GET
        headers:
          Authorization: "Bearer {{ k8s_token }}"
        validate_certs: true
        ca_path: "{{ k8s_ca_path }}"
        status_code: 200
      register: pod_details_api
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Extrair status do pod
      ansible.builtin.set_fact:
        pod_describe: "{{ pod_details_api.json | to_nice_yaml | default('N/A') }}"

    # 5. DESCOBRIR deployment pai via API (ownerReferences)
    - name: Descobrir deployment do pod via API
      ansible.builtin.uri:
        url: "{{ k8s_api }}/api/v1/namespaces/{{ event_namespace }}/pods/{{ event_pod }}"
        method: GET
        headers:
          Authorization: "Bearer {{ k8s_token }}"
        validate_certs: true
        ca_path: "{{ k8s_ca_path }}"
        status_code: 200
      register: pod_json
      ignore_errors: true
      when: event_pod is defined and event_pod | length > 0

    - name: Extrair nome do deployment pai
      ansible.builtin.set_fact:
        parent_deployment: "{{ pod_json.json.metadata.ownerReferences | selectattr('kind', 'equalto', 'ReplicaSet') | map(attribute='name') | first | default('') | regex_replace('-[a-z0-9]+$', '') }}"
      when: pod_json is succeeded and pod_json.json.metadata.ownerReferences is defined

    - name: Mostrar deployment encontrado
      ansible.builtin.debug:
        msg: "Deployment pai: {{ parent_deployment | default('NAO ENCONTRADO') }}"

    # 6. Montar prompt para o LLM
    - name: Montar prompt
      ansible.builtin.set_fact:
        llm_prompt: |
          Voce e um SRE especialista em OpenShift.
          Analise o incidente e responda EXATAMENTE neste formato:

          CAUSA_RAIZ: <uma linha>
          ACAO_REMEDIACAO: <comando oc exato>
          PLAYBOOK_SUGERIDO: <YAML ansible minimo>

          DADOS DO INCIDENTE:
          - Alerta: {{ event_alert_name }}
          - Namespace: {{ event_namespace }}
          - Pod: {{ event_pod | default('N/A') }}
          - Severidade: {{ event_severity }}
          - Descricao: {{ event_description | default('N/A') }}
          - Deployment: {{ parent_deployment | default('N/A') }}

          LOGS DO POD:
          {{ pod_logs }}

          DETALHES DO POD:
          {{ pod_describe | truncate(2000) }}

    # 7. Consultar LLM
    - name: Consultar IA para diagnostico
      ansible.builtin.uri:
        url: "{{ llm_endpoint }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          model: "{{ llm_model }}"
          messages:
            - role: system
              content: "Voce e um engenheiro SRE. Responda apenas no formato solicitado."
            - role: user
              content: "{{ llm_prompt }}"
          temperature: 0.1
          max_tokens: 2000
        status_code: 200
        timeout: 180
      register: llm_response

    - name: Extrair diagnostico
      ansible.builtin.set_fact:
        ai_diagnosis: "{{ llm_response.json.choices[0].message.content }}"

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: |
          🤖 DIAGNOSTICO DA IA:
          {{ ai_diagnosis }}

    # 8. Salvar auditoria
    - name: Salvar relatorio
      ansible.builtin.copy:
        content: |
          === AIOps Report ===
          Data: {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}
          Alerta: {{ event_alert_name }}
          Namespace: {{ event_namespace }}
          Pod: {{ event_pod | default('N/A') }}
          Severidade: {{ event_severity }}
          Deployment: {{ parent_deployment | default('N/A') }}

          === Diagnostico IA ===
          {{ ai_diagnosis }}
        dest: "/tmp/aiops_{{ event_alert_name | replace(' ', '_') }}_{{ event_namespace }}.txt"

    # 9. REMEDIACAO AUTOMATICA (critical) via API REST
    - name: Executar remediacao automatica
      block:
        - name: Rollout restart deployment via API
          ansible.builtin.uri:
            url: "{{ k8s_api }}/apis/apps/v1/namespaces/{{ event_namespace }}/deployments/{{ parent_deployment }}"
            method: PATCH
            headers:
              Authorization: "Bearer {{ k8s_token }}"
              Content-Type: "application/strategic-merge-patch+json"
            validate_certs: true
            ca_path: "{{ k8s_ca_path }}"
            body_format: json
            body:
              spec:
                template:
                  metadata:
                    annotations:
                      kubectl.kubernetes.io/restartedAt: "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          when: parent_deployment | default('') | length > 0
          ignore_errors: true

        - name: Ou deletar pod diretamente (fallback)
          ansible.builtin.uri:
            url: "{{ k8s_api }}/api/v1/namespaces/{{ event_namespace }}/pods/{{ event_pod }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ k8s_token }}"
            validate_certs: true
            ca_path: "{{ k8s_ca_path }}"
            status_code: [200, 202, 404]
          when: parent_deployment | default('') | length == 0

        - name: Notificar sucesso
          ansible.builtin.debug:
            msg: "✅ Remediacao executada para {{ event_alert_name }} em {{ event_namespace }}"
      when: event_severity == "critical"