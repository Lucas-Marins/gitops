---
# =============================================================================
# GLPI Stress Test / Mass Ticket Generator
# =============================================================================
# Objetivo: Gerar 5000+ tickets aleatórios no GLPI para testar automações.
# Alguns tickets simulam vulnerabilidades (CVE, CVSS, severidade).
#
# Variáveis de controle:
#   - ticket_count: Quantidade total de tickets (padrão: 5000)
#   - vuln_ratio:   % de tickets que serão de vulnerabilidade (padrão: 15%)
#   - batch_size:   Tickets por lote antes de pausar (padrão: 100)
#   - delay_sec:    Pausa entre lotes em segundos (padrão: 2)
#   - throttle:     Concorrência máxima (padrão: 5)
# =============================================================================

- name: Gerar massa de tickets no GLPI (Stress Test)
  hosts: localhost
  gather_facts: no
  vars:
    # --- Configuração do GLPI ---
    glpi_url: "https://glpi-glpi.apps.cluster-48fnf.dynamic.redhatworkshops.io"
    glpi_user: "glpi"
    glpi_pass: "glpi"

    # --- Controle de Volume ---
    ticket_count: 5000
    vuln_ratio: 15          # 15% dos tickets serão de vulnerabilidade
    batch_size: 100
    delay_sec: 2
    throttle_val: 5

    # --- Dados para randomização ---
    nomes_chamados:
      - "Falha de conectividade na rede"
      - "Solicitação de acesso ao sistema"
      - "Problema de lentidão no servidor"
      - "Erro ao gerar relatório mensal"
      - "Solicitação de nova VM"
      - "Falha no backup noturno"
      - "Permissão negada em pasta compartilhada"
      - "Atualização de software necessária"
      - "Troca de senha de serviço"
      - "Configuração de firewall"
      - "Incidente de segurança detectado"
      - "Solicitação de licença"
      - "Problema de impressão"
      - "Email não chegando"
      - "VPN desconectando"
      - "Aplicação fora do ar"
      - "Disco cheio no servidor"
      - "Memória insuficiente"
      - "Certificado SSL expirado"
      - "Integração com API falhando"

    descricoes_base:
      - "Usuário reportou instabilidade no ambiente."
      - "Necessário avaliação técnica urgente."
      - "Chamado aberto via automação de monitoramento."
      - "Solicitação registrada pelo time de NOC."
      - "Problema identificado durante rotina de checks."
      - "Demanda recorrente reportada pelo cliente."
      - "Falha detectada em ambiente de produção."
      - "Solicitação de provisionamento de recurso."
      - "Alerta de threshold ultrapassado."
      - "Anomalia detectada em logs do sistema."

    cves:
      - "CVE-2024-1234"
      - "CVE-2024-5678"
      - "CVE-2023-9999"
      - "CVE-2024-1111"
      - "CVE-2024-2222"
      - "CVE-2023-7777"
      - "CVE-2024-3333"
      - "CVE-2024-4444"
      - "CVE-2023-5555"
      - "CVE-2024-8888"

    sistemas_afetados:
      - "Apache HTTP Server 2.4.x"
      - "OpenSSL 3.0"
      - "Linux Kernel 5.15"
      - "PostgreSQL 14"
      - "Node.js 18"
      - "Docker Engine"
      - "Kubernetes Cluster"
      - "NGINX Ingress Controller"
      - "Red Hat Enterprise Linux 9"
      - "Windows Server 2022"

    severidades_vuln:
      - "CRITICA"
      - "ALTA"
      - "MEDIA"
      - "BAIXA"
      - "INFORMATIVA"

  tasks:
    # =========================================================================
    # 1. INICIAR SESSÃO NO GLPI (apenas uma vez)
    # =========================================================================
    - name: Iniciar sessão no GLPI (Basic Auth)
      ansible.builtin.uri:
        url: "{{ glpi_url }}/apirest.php/initSession"
        method: GET
        validate_certs: no
        headers:
          Content-Type: "application/json"
        url_username: "{{ glpi_user }}"
        url_password: "{{ glpi_pass }}"
        force_basic_auth: yes
        status_code: 200
        timeout: 30
      register: session

    - name: Verificar sessão iniciada
      ansible.builtin.fail:
        msg: "Falha ao iniciar sessão no GLPI"
      when: session.status != 200

    # =========================================================================
    # 2. PREPARAR LISTA DE TICKETS A SEREM CRIADOS
    # =========================================================================
    - name: Gerar lista de índices para os tickets
      ansible.builtin.set_fact:
        ticket_indices: "{{ range(1, ticket_count + 1) | list }}"

    # =========================================================================
    # 3. CRIAR TICKETS EM LOTES (reutilizando a sessão)
    # =========================================================================
    - name: Criar ticket no GLPI (loop controlado)
      ansible.builtin.uri:
        url: "{{ glpi_url }}/apirest.php/Ticket"
        method: POST
        validate_certs: no
        headers:
          Session-Token: "{{ session.json.session_token }}"
          Content-Type: "application/json"
        body:
          input:
            name: "{{ item | int % vuln_ratio == 0 | ternary(
                  'VULN: ' + (cves | random) + ' - ' + (sistemas_afetados | random) + ' [' + (severidades_vuln | random) + ']',
                  (nomes_chamados | random) + ' - Ticket #' + (item | string)
                ) }}"
            content: |
              <p>{{ item | int % vuln_ratio == 0 | ternary(
                '<strong>VULNERABILIDADE DETECTADA</strong><br>' +
                'CVE: ' + (cves | random) + '<br>' +
                'Sistema: ' + (sistemas_afetados | random) + '<br>' +
                'Severidade: ' + (severidades_vuln | random) + '<br>' +
                'CVSS Score: ' + (range(1, 10) | random | string) + '.' + (range(0, 9) | random | string) + '<br>' +
                'Data da varredura: ' + ansible_date_time.iso8601 | default(now()) + '<br>' +
                'Recomendação: Aplicar patch de segurança imediatamente.',
                (descricoes_base | random) + ' Ticket gerado automaticamente em stress test.'
              ) }}</p>
            type: 1
            urgency: "{{ item | int % vuln_ratio == 0 | ternary(5, range(2, 5) | random) }}"
            impact: "{{ item | int % vuln_ratio == 0 | ternary(5, range(2, 5) | random) }}"
            priority: "{{ item | int % vuln_ratio == 0 | ternary(5, range(1, 5) | random) }}"
            requesttypes_id: 6
            itilcategories_id: "{{ item | int % vuln_ratio == 0 | ternary(7, range(1, 10) | random) }}"
        body_format: json
        status_code: 201
        timeout: 30
      loop: "{{ ticket_indices }}"
      loop_control:
        label: "Ticket {{ item }}/{{ ticket_count }}"
      throttle: "{{ throttle_val }}"
      register: ticket_result
      ignore_errors: yes
      retries: 3
      delay: 1
      until: ticket_result is succeeded

    # =========================================================================
    # 4. ESTATÍSTICAS DOS TICKETS CRIADOS
    # =========================================================================
    - name: Calcular estatísticas
      ansible.builtin.set_fact:
        total_ok: "{{ ticket_result.results | selectattr('status', 'equalto', 201) | list | length }}"
        total_fail: "{{ ticket_result.results | selectattr('failed', 'equalto', true) | default([]) | list | length }}"
        ticket_ids: "{{ ticket_result.results | selectattr('json.id', 'defined') | map(attribute='json.id') | list }}"
        vuln_tickets: "{{ ticket_result.results | selectattr('json.id', 'defined') | selectattr('item', 'match', '^[0-9]+$') | selectattr('item', 'in', range(1, ticket_count + 1) | select('divisibleby', vuln_ratio) | list) | map(attribute='json.id') | list }}"

    - name: Mostrar resumo
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "  STRESS TEST GLPI - RESUMO"
          - "========================================"
          - "Total solicitado: {{ ticket_count }}"
          - "Total criados (HTTP 201): {{ total_ok }}"
          - "Total falhas: {{ total_fail }}"
          - "Tickets de vulnerabilidade (~{{ vuln_ratio }}%): {{ vuln_tickets | length }}"
          - "Primeiros 5 IDs: {{ ticket_ids[:5] }}"
          - "========================================"

    - name: Exportar IDs para o Workflow
      ansible.builtin.set_stats:
        data:
          glpi_total_criados: "{{ total_ok }}"
          glpi_total_falhas: "{{ total_fail }}"
          glpi_ticket_ids: "{{ ticket_ids }}"
          glpi_vuln_ticket_ids: "{{ vuln_tickets }}"
        per_host: no

    # =========================================================================
    # 5. ENCERRAR SESSÃO
    # =========================================================================
    - name: Encerrar sessão no GLPI
      ansible.builtin.uri:
        url: "{{ glpi_url }}/apirest.php/killSession"
        method: GET
        validate_certs: no
        headers:
          Session-Token: "{{ session.json.session_token }}"
        status_code: 200
      ignore_errors: yes