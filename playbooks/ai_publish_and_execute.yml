---
- name: Prepare AI generated or reused automation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    github_api: "https://api.github.com/repos/Lucas-Marins/gitops"
    github_branch: "ansible"
    github_raw: "https://raw.githubusercontent.com/Lucas-Marins/gitops/ansible"
    runtime_file: "/tmp/ai-generated-tasks.yml"
    source_file: "/tmp/ai-source-tasks.yml"
    catalog_file: "automation-catalog.yml"

  tasks:

    # =====================================================
    # INITIAL VALIDATION
    # =====================================================

    - name: Validate automation action
      ansible.builtin.assert:
        that:
          - automation_action is defined
          - automation_action in ['reuse', 'generate']
        fail_msg: "Unknown or missing automation action."

    - name: Define runtime file
      ansible.builtin.set_fact:
        generated_runtime_file: "{{ runtime_file }}"

    # =====================================================
    # READ AUTOMATION CATALOG
    # =====================================================

    - name: Read automation catalog from GitHub
      ansible.builtin.uri:
        url: "{{ github_api }}/contents/{{ catalog_file }}?ref={{ github_branch }}"
        method: GET
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
        status_code: 200
      register: catalog_response
      no_log: true

    - name: Decode automation catalog
      ansible.builtin.set_fact:
        catalog_sha: "{{ catalog_response.json.sha }}"
        catalog_data: "{{ catalog_response.json.content | b64decode | from_yaml }}"

    - name: Validate catalog structure
      ansible.builtin.assert:
        that:
          - catalog_data is mapping
          - catalog_data.automations is defined
          - catalog_data.automations is sequence
          - catalog_data.automations is not string
        fail_msg: "The GitHub automation catalog has an unexpected YAML structure."

    # =====================================================
    # VALIDATE REUSE AGAINST GITHUB CATALOG
    # =====================================================

    - name: Validate existing automation parameters
      ansible.builtin.assert:
        that:
          - automation_id is defined
          - automation_id | length > 0
          - automation_file is defined
          - automation_file | length > 0
        fail_msg: "Automation ID or file path was not provided."
      when: automation_action == 'reuse'

    - name: Find automation in catalog
      ansible.builtin.set_fact:
        reuse_matches: >-
          {{
            catalog_data.automations
            | selectattr('id', 'equalto', automation_id)
            | list
          }}
      when: automation_action == 'reuse'

    - name: Check whether automation exists uniquely in catalog
      ansible.builtin.assert:
        that:
          - reuse_matches | length == 1
        fail_msg: >-
          REUSE rejected. Automation ID {{ automation_id }}
          does not exist uniquely in the GitHub catalog.
      when: automation_action == 'reuse'

    - name: Get trusted automation file path from catalog
      ansible.builtin.set_fact:
        reuse_catalog_file: "{{ reuse_matches[0].file | default('') }}"
      when: automation_action == 'reuse'

    - name: Validate automation file path against catalog
      ansible.builtin.assert:
        that:
          - reuse_catalog_file | length > 0
          - automation_file == reuse_catalog_file
          - reuse_catalog_file is match('^playbooks/generated/[A-Za-z0-9._-]+\.ya?ml$')
        fail_msg: >-
          REUSE rejected. The requested automation file does not match
          the file registered in the GitHub catalog.
      when: automation_action == 'reuse'

    # =====================================================
    # REUSE EXISTING AUTOMATION
    # =====================================================

    - name: Download existing automation from GitHub
      ansible.builtin.get_url:
        url: "{{ github_raw }}/{{ reuse_catalog_file }}"
        dest: "{{ source_file }}"
        mode: "0600"
        force: true
      when: automation_action == 'reuse'

    - name: Read existing automation
      ansible.builtin.slurp:
        src: "{{ source_file }}"
      register: reused_file
      when: automation_action == 'reuse'

    - name: Load reused YAML content
      ansible.builtin.set_fact:
        source_tasks_yaml: "{{ reused_file.content | b64decode }}"
      when: automation_action == 'reuse'

    # =====================================================
    # GENERATE NEW AUTOMATION
    # =====================================================

    - name: Validate generated automation
      ansible.builtin.assert:
        that:
          - tasks_yaml is defined
          - tasks_yaml | length > 0
          - automation_id is defined
          - automation_id | length > 0
          - automation_id != 'new_automation_id'
          - summary is defined
          - summary | length > 0
        fail_msg: "Generated automation is missing required information."
      when: automation_action == 'generate'

    - name: Check whether generated automation ID already exists
      ansible.builtin.assert:
        that:
          - >-
            (
              catalog_data.automations
              | selectattr('id', 'equalto', automation_id)
              | list
              | length
            ) == 0
        fail_msg: >-
          This automation ID already exists in the catalog.
          Generate a different automation_id.
      when: automation_action == 'generate'

    - name: Load generated YAML content
      ansible.builtin.set_fact:
        source_tasks_yaml: "{{ tasks_yaml }}"
      when: automation_action == 'generate'

    # =====================================================
    # COMMON TASK NORMALIZATION
    # =====================================================

    - name: Parse automation YAML
      ansible.builtin.set_fact:
        parsed_tasks: "{{ source_tasks_yaml | from_yaml }}"

    - name: Extract task list
      ansible.builtin.set_fact:
        ai_tasks: >-
          {{
            parsed_tasks['tasks']
            if parsed_tasks is mapping and 'tasks' in parsed_tasks
            else parsed_tasks
          }}

    - name: Initialize normalized task list
      ansible.builtin.set_fact:
        normalized_ai_tasks: []

    - name: Remove invalid output metadata
      ansible.builtin.set_fact:
        normalized_ai_tasks: >-
          {{
            normalized_ai_tasks
            +
            [
              item
              | dict2items
              | rejectattr('key', 'equalto', 'output')
              | items2dict
            ]
          }}
      loop: "{{ ai_tasks }}"
      loop_control:
        label: "{{ item.name | default('Unnamed task') }}"

    - name: Prepare normalized YAML
      ansible.builtin.set_fact:
        normalized_tasks_yaml: >-
          {{
            normalized_ai_tasks
            | to_nice_yaml
            | replace('.output', '.stdout')
          }}

    - name: Save automation for execution
      ansible.builtin.copy:
        content: "{{ normalized_tasks_yaml }}"
        dest: "{{ runtime_file }}"
        mode: "0600"

    # =====================================================
    # GENERATE UNIQUE FILENAME
    # =====================================================

    - name: Generate filename base
      ansible.builtin.set_fact:
        filename_base: >-
          {{
            (filename | default('ai_generated_tasks', true))
            | regex_replace('\.ya?ml$', '')
            | regex_replace('[^A-Za-z0-9_-]', '_')
          }}
      when: automation_action == 'generate'

    - name: Generate unique filename
      ansible.builtin.set_fact:
        generated_filename: >-
          {{ filename_base }}_{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%N') }}.yml
      when: automation_action == 'generate'

    - name: Define generated GitHub path
      ansible.builtin.set_fact:
        generated_github_path: "playbooks/generated/{{ generated_filename }}"
      when: automation_action == 'generate'

    # =====================================================
    # PUBLISH NEW AUTOMATION FILE TO GITHUB
    # =====================================================

    - name: Publish new automation to GitHub
      ansible.builtin.uri:
        url: "{{ github_api }}/contents/{{ generated_github_path }}"
        method: PUT
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "AI generated automation: {{ generated_filename }}"
          content: "{{ normalized_tasks_yaml | b64encode }}"
          branch: "{{ github_branch }}"
        status_code: 201
        return_content: true
      register: github_result
      no_log: true
      when: automation_action == 'generate'

    # =====================================================
    # CREATE NEW CATALOG ENTRY
    # =====================================================

    - name: Create new automation catalog entry
      ansible.builtin.set_fact:
        new_catalog_entry:
          id: "{{ automation_id }}"
          name: "{{ automation_id | replace('_', ' ') | title }}"
          description: "{{ summary }}"
          type: "ansible_tasks"
          file: "{{ generated_github_path }}"
          created_by: "ai_task_agent"
      when: automation_action == 'generate'

    - name: Add automation to catalog
      ansible.builtin.set_fact:
        updated_catalog: >-
          {{
            catalog_data
            | combine({
                'automations':
                  catalog_data.automations + [new_catalog_entry]
              })
          }}
      when: automation_action == 'generate'

    # =====================================================
    # PUBLISH UPDATED CATALOG TO GITHUB
    # =====================================================

    - name: Publish updated automation catalog to GitHub
      ansible.builtin.uri:
        url: "{{ github_api }}/contents/{{ catalog_file }}"
        method: PUT
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "Add automation {{ automation_id }} to catalog"
          content: "{{ updated_catalog | to_nice_yaml(indent=2, sort_keys=false) | b64encode }}"
          sha: "{{ catalog_sha }}"
          branch: "{{ github_branch }}"
        status_code: 200
        return_content: true
      register: catalog_publish_response
      no_log: true
      when: automation_action == 'generate'

    # =====================================================
    # REPORT AUTOMATION SELECTION
    # =====================================================

    - name: Report automation selection
      ansible.builtin.debug:
        msg: >-
          {{
            'Reusing validated automation: ' ~ reuse_catalog_file
            if automation_action == 'reuse'
            else
            'Created automation: ' ~ generated_github_path
            ~ '. Automation catalog successfully updated.'
          }}

# =========================================================
# EXECUTE ON LINUX VM
# =========================================================

- name: Execute selected automation on Linux VM
  hosts: linux-target-01
  gather_facts: false
  become: false

  tasks:

    - name: Execute selected Ansible tasks
      ansible.builtin.include_tasks:
        file: "{{ hostvars['localhost']['generated_runtime_file'] }}"