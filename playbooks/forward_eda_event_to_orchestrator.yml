
---
- name: Forward GLPI event to Automation Orchestrator
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - webhook_base_url is defined
          - webhook_client_id is defined
          - webhook_client_secret is defined
          - webhook_path is defined
          - event_payload is defined
          - event_payload.item is defined
          - event_payload.item.id is defined
          - event_payload.item.content is defined
        fail_msg: "Missing Orchestrator integration parameters or GLPI ticket data."

    - name: Extract automation request from GLPI description
      ansible.builtin.set_fact:
        automation_request: >-
          {{
            event_payload.item.content
            | regex_replace('(?i)<br\s*/?>', ' ')
            | regex_replace('(?i)</p\s*>', ' ')
            | regex_replace('<[^>]+>', ' ')
            | regex_replace('&nbsp;|&#160;', ' ')
            | regex_replace('\s+', ' ')
            | trim
          }}

    - name: Validate automation request
      ansible.builtin.assert:
        that:
          - automation_request | length > 0
        fail_msg: "The GLPI ticket description does not contain an automation request."

    - name: Build standardized Orchestrator payload
      ansible.builtin.set_fact:
        orchestrator_payload:
          source: "glpi"
          automation_request: "{{ automation_request }}"
          glpi:
            ticket_id: "{{ event_payload.item.id }}"
            ticket_title: "{{ event_payload.item.name | default('') }}"
            event: "{{ event_payload.event | default('new') }}"
            requester: "{{ event_payload.item.user_recipient.name | default('unknown') }}"

    - name: Obtain Orchestrator service account token
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        status_code: 200
        return_content: true
      register: token_response
      no_log: true

    - name: Send normalized GLPI event to Orchestrator
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/eda/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body: "{{ orchestrator_payload }}"
        status_code: 202
        return_content: true
      register: webhook_response
      no_log: true

    - name: Display Orchestrator execution information
      ansible.builtin.debug:
        msg: >-
          Orchestrator workflow started.
          GLPI Ticket ID: {{ event_payload.item.id }}
          Automation Request: {{ automation_request }}
          Execution ID:
          {{ webhook_response.json.execution_id | default('Accepted') }}
