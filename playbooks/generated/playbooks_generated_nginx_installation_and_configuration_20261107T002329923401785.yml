-   become: true
    hosts: linux-web-01
    name: Install Nginx
    tasks:
    -   ansible.builtin.package:
            name: nginx
            state: present
        name: Install Nginx package
    -   ansible.builtin.service:
            enabled: true
            name: nginx
            state: started
        name: Start and enable Nginx service
    -   ansible.builtin.firewalld:
            immediate: true
            permanent: true
            port: 80/tcp
            state: enabled
        changed_when: false
        name: Open port 80 for Nginx
