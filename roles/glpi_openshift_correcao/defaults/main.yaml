---
# GLPI
glpi_user: "glpi"
glpi_pass: "glpi"
glpi_url: "https://glpi-glpi.apps.cluster-rwmjf.dynamic.redhatworkshops.io"
glpi_search_filter: "Correção"

# OpenShift
openshift_namespace: "linuxvm"
snapshot_api_version: "snapshot.kubevirt.io/v1beta1"

# Snapshot
snapshot_prefix: "glpi"

# VM update
vm_become: yes
vm_become_user: root
vm_ssh_timeout: 600

glpi_group_name: "ansible"

# glpi_status_open: "2"
# glpi_page_size: 100

pacotes_criticos_regex: "(httpd|haproxy|nfs-utils|nfs-server)"