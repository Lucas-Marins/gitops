---
# ═══════════════════════════════════════════════════════════
# JOB 1: Busca tickets, lista TODOS os pacotes,
# envia card no Teams com aprovação + destaque nos críticos,
# salva JSON para o Job 2 executar apos aprovacao.
# ═══════════════════════════════════════════════════════════

- name: "GLPI | Iniciar sessao"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/initSession"
    method: GET
    headers:
      Authorization: "Basic {{ (glpi_user + ':' + glpi_pass) | b64encode }}"
    validate_certs: false
    status_code: 200
  register: glpi_session

- name: "GLPI | Guardar token"
  ansible.builtin.set_fact:
    glpi_session_token: "{{ glpi_session.json.session_token }}"

# ── 1. LISTAR GRUPOS ──
- name: "GLPI | Listar grupos para achar ID pelo nome"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Group?range=0-999"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _all_groups

- name: "GLPI | Extrair ID do grupo pelo nome"
  ansible.builtin.set_fact:
    glpi_group_id: "{{ (_all_groups.json | selectattr('name', 'equalto', glpi_group_name) | first | default({})).id | default('') }}"

- name: "GLPI | Abortar se grupo nao encontrado"
  ansible.builtin.fail:
    msg: "Grupo '{{ glpi_group_name }}' nao encontrado. Existentes: {{ _all_groups.json | map(attribute='name') | list }}"
  when: glpi_group_id | length == 0

# ── 2. BUSCAR Group_Ticket PAGINADO ──
- name: "GLPI | Inicializar paginacao"
  ansible.builtin.set_fact:
    _gt_page_start: 0
    _gt_all_results: []
    _gt_has_more: true

- name: "GLPI | Buscar Group_Ticket do grupo (paginado)"
  ansible.builtin.include_tasks: buscar_group_ticket_pagina.yml
  when: _gt_has_more | bool

# ── 3. EXTRAIR IDs ──
- name: "GLPI | Extrair IDs dos tickets"
  ansible.builtin.set_fact:
    _ticket_ids: "{{ _gt_all_results | map(attribute='tickets_id') | list | unique }}"

# ── 4. BUSCAR DETALHES ──
- name: "GLPI | Buscar detalhes dos tickets"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Ticket/{{ item }}?expand_dropdowns=true"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _ticket_details
  loop: "{{ _ticket_ids }}"
  loop_control:
    label: "Ticket ID {{ item }}"

# ── 5. NORMALIZAR ──
- name: "GLPI | Normalizar tickets"
  ansible.builtin.set_fact:
    _ticket_item:
      id: "{{ item.json.id }}"
      name: "{{ item.json.name }}"
      status: "{{ item.json.status | default('') }}"
  loop: "{{ _ticket_details.results }}"
  register: _ticket_items

- name: "GLPI | Consolidar tickets"
  ansible.builtin.set_fact:
    glpi_tickets: "{{ _ticket_items.results | map(attribute='ansible_facts._ticket_item') | list }}"

# ── 6. FILTRAR STATUS 2 (Em atendimento) ──
- name: "GLPI | Filtrar tickets em atendimento (status 2)"
  ansible.builtin.set_fact:
    glpi_tickets_processar: "{{ glpi_tickets | selectattr('status', 'defined') | selectattr('status', 'equalto', '2') | list }}"

- name: "GLPI | Debug — tickets a processar"
  ansible.builtin.debug:
    msg: "Total em atendimento: {{ glpi_tickets_processar | length }} | IDs: {{ glpi_tickets_processar | map(attribute='id') | list }}"

- name: "GLPI | Abortar se nenhum ticket em processo"
  ansible.builtin.fail:
    msg: "Nenhum ticket com status 'Em atendimento' (2) encontrado no grupo {{ glpi_group_name }}."
  when: glpi_tickets_processar | length == 0

# ── 7. VERIFICAR PACOTES POR TICKET ──
- name: "GLPI | Inicializar lista de aprovacao"
  ansible.builtin.set_fact:
    _tickets_para_aprovacao: []

- name: "GLPI | Verificar pacotes por ticket"
  ansible.builtin.include_tasks: verificar_pacotes_por_ticket.yml
  loop: "{{ glpi_tickets_processar }}"
  loop_control:
    loop_var: ticket

# ── 8. CONTAR CRITICOS ──
- name: "GLPI | Contar tickets com criticos"
  ansible.builtin.set_fact:
    _total_tickets: "{{ _tickets_para_aprovacao | length }}"
    _tickets_com_criticos: "{{ _tickets_para_aprovacao | selectattr('tem_criticos', 'equalto', true) | list }}"
    _tickets_sem_criticos: "{{ _tickets_para_aprovacao | selectattr('tem_criticos', 'equalto', false) | list }}"

- name: "GLPI | Debug — resumo"
  ansible.builtin.debug:
    msg: "Total: {{ _total_tickets }} | Com criticos: {{ _tickets_com_criticos | length }} | Sem criticos: {{ _tickets_sem_criticos | length }}"

# ── 9. SALVAR TODOS EM JSON PARA O JOB 2 ──
- name: "GLPI | Definir ID do workflow"
  ansible.builtin.set_fact:
    _workflow_id: "{{ tower_workflow_job_id | default(lookup('pipe', 'date +%s')) }}"

- name: "GLPI | Salvar tickets para aprovacao em JSON"
  ansible.builtin.copy:
    dest: "/tmp/glpi_aprovacao_{{ _workflow_id }}.json"
    content: "{{ _tickets_para_aprovacao | to_nice_json }}"
  when: _tickets_para_aprovacao | length > 0

# ── 10. NOTIFICAR TEAMS VIA POWER AUTOMATE ──
# Se houver criticos: envia aprovacao + detalhes dos criticos
# Se NAO houver criticos: envia aprovacao simples
- name: "GLPI | Notificar Teams COM criticos"
  ansible.builtin.uri:
    url: "{{ teams_webhook_url }}"
    method: POST
    body_format: json
    body:
      type: "AdaptiveCard"
      version: "1.2"
      body:
        - type: "TextBlock"
          text: "🔒 Aprovacao necessaria — {{ _total_tickets }} ticket(s) — ⚠️ {{ _tickets_com_criticos | length }} CRITICO(S)"
          size: "Large"
          weight: "Bolder"
          color: "Attention"
        - type: "FactSet"
          facts:
            - title: "Workflow:"
              value: "{{ _workflow_id }}"
            - title: "Total tickets:"
              value: "{{ _total_tickets }}"
            - title: "Com criticos:"
              value: "{{ _tickets_com_criticos | length }}"
        - type: "TextBlock"
          text: "⚠️ SERVIDORES CRITICOS:"
          weight: "Bolder"
          size: "Medium"
          color: "Attention"
        - type: "TextBlock"
          text: |
            {% for t in _tickets_com_criticos %}
            🔴 Ticket #{{ t.id }} | VM: {{ t.vm_name }} ({{ t.vm_ip }})
            Pacotes CRITICOS: {{ t.criticos | join(', ') }}
            Demais: {{ t.nao_criticos | join(', ') | default('nenhum') }}
            ---
            {% endfor %}
          wrap: true
        - type: "TextBlock"
          text: "Demais tickets (sem criticos):"
          weight: "Bolder"
          size: "Medium"
          isSubtle: true
        - type: "TextBlock"
          text: |
            {% for t in _tickets_sem_criticos %}
            • Ticket #{{ t.id }} | VM: {{ t.vm_name }} ({{ t.vm_ip }})
            Pacotes: {{ t.todos_pacotes | join(', ') | default('nenhum') }}
            {% endfor %}
          wrap: true
          isSubtle: true
        - type: "TextBlock"
          text: "O workflow esta PAUSADO no AAP. Clique para aprovar ou rejeitar."
          wrap: true
          isSubtle: true
          color: "Warning"
      actions:
        - type: "Action.OpenUrl"
          title: "🔗 Aprovar / Rejeitar no AAP"
          url: "{{ aap_base_url }}/controller/#/jobs/workflow/{{ tower_workflow_job_id }}/details"
    status_code: [200, 202]
  when:
    - _tickets_para_aprovacao | length > 0
    - _tickets_com_criticos | length > 0
    - teams_webhook_url is defined
    - teams_webhook_url | length > 0
  ignore_errors: true

- name: "GLPI | Notificar Teams SEM criticos"
  ansible.builtin.uri:
    url: "{{ teams_webhook_url }}"
    method: POST
    body_format: json
    body:
      type: "AdaptiveCard"
      version: "1.2"
      body:
        - type: "TextBlock"
          text: "🔒 Aprovacao necessaria — {{ _total_tickets }} ticket(s)"
          size: "Large"
          weight: "Bolder"
          color: "Attention"
        - type: "FactSet"
          facts:
            - title: "Workflow:"
              value: "{{ _workflow_id }}"
            - title: "Total tickets:"
              value: "{{ _total_tickets }}"
            - title: "Pacotes criticos:"
              value: "Nenhum detectado"
        - type: "TextBlock"
          text: "Tickets para aprovacao:"
          weight: "Bolder"
          size: "Medium"
        - type: "TextBlock"
          text: |
            {% for t in _tickets_para_aprovacao %}
            • Ticket #{{ t.id }} | VM: {{ t.vm_name }} ({{ t.vm_ip }})
            Pacotes: {{ t.todos_pacotes | join(', ') | default('nenhum') }}
            {% endfor %}
          wrap: true
        - type: "TextBlock"
          text: "O workflow esta PAUSADO no AAP. Clique para aprovar ou rejeitar."
          wrap: true
          isSubtle: true
          color: "Warning"
      actions:
        - type: "Action.OpenUrl"
          title: "🔗 Aprovar / Rejeitar no AAP"
          url: "{{ aap_base_url }}/controller/#/jobs/workflow/{{ tower_workflow_job_id }}/details"
    status_code: [200, 202]
  when:
    - _tickets_para_aprovacao | length > 0
    - _tickets_com_criticos | length == 0
    - teams_webhook_url is defined
    - teams_webhook_url | length > 0
  ignore_errors: true

# ── 11. ENCERRAR SESSAO GLPI ──
- name: "GLPI | Encerrar sessao"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/killSession"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  ignore_errors: true