---
# ═══════════════════════════════════════════════════════════
# JOB 1: Busca tickets, lista TODOS os pacotes,
# envia UM card no Teams com aprovacao + destaque nos criticos,
# passa dados para Job 2 via set_stats.
# ═══════════════════════════════════════════════════════════

- name: "GLPI | Iniciar sessao"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/initSession"
    method: GET
    headers:
      Authorization: "Basic {{ (glpi_user + ':' + glpi_pass) | b64encode }}"
    validate_certs: false
    status_code: 200
  register: glpi_session

- name: "GLPI | Guardar token"
  ansible.builtin.set_fact:
    glpi_session_token: "{{ glpi_session.json.session_token }}"

# ── 1. LISTAR GRUPOS ──
- name: "GLPI | Listar grupos para achar ID pelo nome"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Group?range=0-999"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _all_groups

- name: "GLPI | Extrair ID do grupo pelo nome"
  ansible.builtin.set_fact:
    glpi_group_id: "{{ (_all_groups.json | selectattr('name', 'equalto', glpi_group_name) | first | default({})).id | default('') }}"

- name: "GLPI | Abortar se grupo nao encontrado"
  ansible.builtin.fail:
    msg: "Grupo '{{ glpi_group_name }}' nao encontrado. Existentes: {{ _all_groups.json | map(attribute='name') | list }}"
  when: glpi_group_id | length == 0

# ── 2. BUSCAR Group_Ticket PAGINADO ──
- name: "GLPI | Inicializar paginacao"
  ansible.builtin.set_fact:
    _gt_page_start: 0
    _gt_all_results: []
    _gt_has_more: true

- name: "GLPI | Buscar Group_Ticket do grupo (paginado)"
  ansible.builtin.include_tasks: buscar_group_ticket_pagina.yml
  when: _gt_has_more | bool

# ── 3. EXTRAIR IDs ──
- name: "GLPI | Extrair IDs dos tickets"
  ansible.builtin.set_fact:
    _ticket_ids: "{{ _gt_all_results | map(attribute='tickets_id') | list | unique }}"

# ── 4. BUSCAR DETALHES ──
- name: "GLPI | Buscar detalhes dos tickets"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Ticket/{{ item }}?expand_dropdowns=true"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _ticket_details
  loop: "{{ _ticket_ids }}"
  loop_control:
    label: "Ticket ID {{ item }}"

# ── 5. NORMALIZAR ──
- name: "GLPI | Normalizar tickets"
  ansible.builtin.set_fact:
    _ticket_item:
      id: "{{ item.json.id }}"
      name: "{{ item.json.name }}"
      status: "{{ item.json.status | default('') }}"
  loop: "{{ _ticket_details.results }}"
  register: _ticket_items

- name: "GLPI | Consolidar tickets"
  ansible.builtin.set_fact:
    glpi_tickets: "{{ _ticket_items.results | map(attribute='ansible_facts._ticket_item') | list }}"

# ── 6. FILTRAR STATUS 2 (Em atendimento) ──
- name: "GLPI | Filtrar tickets em atendimento (status 2)"
  ansible.builtin.set_fact:
    glpi_tickets_processar: "{{ glpi_tickets | selectattr('status', 'defined') | selectattr('status', 'equalto', '2') | list }}"

- name: "GLPI | Debug — tickets a processar"
  ansible.builtin.debug:
    msg: "Total em atendimento: {{ glpi_tickets_processar | length }} | IDs: {{ glpi_tickets_processar | map(attribute='id') | list }}"

- name: "GLPI | Abortar se nenhum ticket em processo"
  ansible.builtin.fail:
    msg: "Nenhum ticket com status 'Em atendimento' (2) encontrado no grupo {{ glpi_group_name }}."
  when: glpi_tickets_processar | length == 0

# ── 7. VERIFICAR PACOTES POR TICKET ──
- name: "GLPI | Inicializar lista de aprovacao"
  ansible.builtin.set_fact:
    _tickets_para_aprovacao: []

- name: "GLPI | Verificar pacotes por ticket"
  ansible.builtin.include_tasks: verificar_pacotes_por_ticket.yml
  loop: "{{ glpi_tickets_processar }}"
  loop_control:
    loop_var: ticket

# ── 8. CONTAR CRITICOS ──
- name: "GLPI | Contar tickets com criticos"
  ansible.builtin.set_fact:
    _total_tickets: "{{ _tickets_para_aprovacao | length }}"
    _tickets_com_criticos: "{{ _tickets_para_aprovacao | default([]) | selectattr('tem_criticos', 'equalto', true) | list }}"
    _tickets_sem_criticos: "{{ _tickets_para_aprovacao | default([]) | selectattr('tem_criticos', 'equalto', false) | list }}"
    _tem_criticos: "{{ (_tickets_para_aprovacao | default([]) | selectattr('tem_criticos', 'equalto', true) | list) | length > 0 }}"

- name: "GLPI | Debug — resumo"
  ansible.builtin.debug:
    msg: "Total: {{ _total_tickets }} | Com criticos: {{ _tickets_com_criticos | length }} | Sem criticos: {{ _tickets_sem_criticos | length }}"

# ── 9. PASSAR DADOS PARA O JOB 2 VIA SET_STATS ──
- name: "GLPI | Passar tickets para aprovacao via set_stats"
  ansible.builtin.set_stats:
    data:
      glpi_tickets_para_aprovacao: "{{ _tickets_para_aprovacao }}"
      glpi_total_tickets: "{{ _total_tickets }}"
      glpi_tickets_com_criticos: "{{ _tickets_com_criticos | length }}"
  when: _tickets_para_aprovacao | length > 0

# ── 10. RENDERIZAR TEMPLATE DO CARD ──
- name: "GLPI | Renderizar template do card"
  ansible.builtin.template:
    src: teams_card.json.j2
    dest: /tmp/glpi_card_{{ tower_workflow_job_id }}.json
  vars:
    tem_criticos: "{{ _tem_criticos }}"
    total_tickets: "{{ _total_tickets }}"
    tickets_com_criticos: "{{ _tickets_com_criticos | length }}"
    workflow_job_id: "{{ tower_workflow_job_id }}"
    tickets: "{{ _tickets_para_aprovacao }}"
    aap_base_url: "{{ aap_base_url }}"

- name: "GLPI | Ler card renderizado"
  ansible.builtin.slurp:
    src: /tmp/glpi_card_{{ tower_workflow_job_id }}.json
  register: _card_file

- name: "GLPI | Parsear card JSON"
  ansible.builtin.set_fact:
    _card_body: "{{ (_card_file.content | b64decode | from_json) }}"

# ── 11. ENVIAR CARD PARA O POWER AUTOMATE ──
- name: "GLPI | Enviar card para Teams via Power Automate"
  ansible.builtin.uri:
    url: "{{ teams_webhook_url }}"
    method: POST
    body_format: json
    body: "{{ _card_body }}"
    status_code: [200, 202]
  when:
    - _tickets_para_aprovacao | length > 0
    - teams_webhook_url is defined
    - teams_webhook_url | length > 0
  ignore_errors: true

# ── 12. ENCERRAR SESSAO GLPI ──
- name: "GLPI | Encerrar sessao"
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/killSession"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  ignore_errors: true