---
# Entrypoint da role glpi_openshift_correcao
# Busca tickets por usuário atribuído (Assigned to) + status aberto

- name: GLPI | Iniciar sessao
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/initSession"
    method: GET
    headers:
      Authorization: "Basic {{ (glpi_user + ':' + glpi_pass) | b64encode }}"
    validate_certs: false
    status_code: 200
  register: glpi_session

- name: GLPI | Guardar token
  ansible.builtin.set_fact:
    glpi_session_token: "{{ glpi_session.json.session_token }}"

# ═══════════════════════════════════════════════════════════
# BUSCA POR USUÁRIO ATRIBUÍDO (Assigned to) + STATUS ABERTO
# ═══════════════════════════════════════════════════════════
- name: GLPI | Buscar tickets atribuídos ao usuário {{ glpi_assignee }}
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/search/Ticket?criteria[0][field]=5&criteria[0][searchtype]=equals&criteria[0][value]={{ glpi_assignee | urlencode }}&criteria[1][field]=12&criteria[1][searchtype]=equals&criteria[1][value]={{ glpi_status_open }}&is_deleted=0"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _glpi_search

- name: GLPI | Verificar resultado
  ansible.builtin.set_fact:
    _tickets_raw: "{{ _glpi_search.json.data | default([]) }}"
    _total: '{{ (_glpi_search.content_range | default("0-0/0") | regex_replace("^.*/(\d+)$", "\\1")) | int }}'

- name: GLPI | Debug
  ansible.builtin.debug:
    msg: "Assignee: {{ glpi_assignee }} | Tickets abertos: {{ _total }} | Nesta página: {{ _tickets_raw | length }}"

# Paginação só se necessário
- name: GLPI | Buscar lotes adicionais
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/search/Ticket?range={{ item }}-{{ item + glpi_page_size - 1 }}&criteria[0][field]=5&criteria[0][searchtype]=equals&criteria[0][value]={{ glpi_assignee | urlencode }}&criteria[1][field]=12&criteria[1][searchtype]=equals&criteria[1][value]={{ glpi_status_open }}&is_deleted=0"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _extra_batches
  loop: "{{ range(glpi_page_size, _total | int, glpi_page_size) | list }}"
  when: (_total | int) > glpi_page_size

- name: GLPI | Juntar lotes extras
  ansible.builtin.set_fact:
    _tickets_raw: "{{ _tickets_raw + item.json.data | default([]) }}"
  loop: "{{ _extra_batches.results | default([]) }}"
  when: item.json.data is defined

# Normalizar
- name: GLPI | Normalizar tickets
  ansible.builtin.set_fact:
    _ticket_item:
      id: "{{ item['2'] | int }}"
      name: "{{ item['1'] }}"
  loop: "{{ _tickets_raw }}"
  register: _ticket_items

- name: GLPI | Consolidar
  ansible.builtin.set_fact:
    glpi_tickets: "{{ _ticket_items.results | map(attribute='ansible_facts._ticket_item') | list }}"

- name: GLPI | Debug final
  ansible.builtin.debug:
    msg: "Total para processar: {{ glpi_tickets | length }} | IDs: {{ glpi_tickets | map(attribute='id') | list }}"

