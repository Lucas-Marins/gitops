---
# Entrypoint da role glpi_openshift_correcao
# Busca Group_Ticket e extrai ID do ticket do link href

- name: GLPI | Iniciar sessao
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/initSession"
    method: GET
    headers:
      Authorization: "Basic {{ (glpi_user + ':' + glpi_pass) | b64encode }}"
    validate_certs: false
    status_code: 200
  register: glpi_session

- name: GLPI | Guardar token
  ansible.builtin.set_fact:
    glpi_session_token: "{{ glpi_session.json.session_token }}"

# Buscar Group_Ticket diretamente — retorna apenas relacionamentos do grupo
- name: GLPI | Buscar Group_Ticket do grupo {{ glpi_group_name }}
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Group_Ticket?expand_dropdowns=true&range=0-999"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _group_tickets

# Extrair IDs dos tickets dos links href
# O link href contém: "http://.../api/Ticket/3" — extraímos o ID do final
- name: GLPI | Extrair IDs dos tickets do grupo {{ glpi_group_name }}
  ansible.builtin.set_fact:
    _ticket_ids: "{{ _ticket_ids | default([]) + [item.links | selectattr('rel', 'equalto', 'Ticket') | map(attribute='href') | first | regex_replace('^.*/', '') | int] }}"
  loop: "{{ _group_tickets.json | selectattr('groups_id', 'equalto', glpi_group_name) | list }}"
  loop_control:
    label: "Group_Ticket ID {{ item.id }}"

- name: GLPI | Debug — IDs extraídos
  ansible.builtin.debug:
    msg: "Tickets do grupo {{ glpi_group_name }}: {{ _ticket_ids | length }} | IDs: {{ _ticket_ids }}"

# Buscar detalhes de cada ticket pelo ID
- name: GLPI | Buscar detalhes dos tickets
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/Ticket/{{ item }}?expand_dropdowns=true"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: _ticket_details
  loop: "{{ _ticket_ids }}"
  loop_control:
    label: "Ticket ID {{ item }}"

# Normalizar para o formato esperado pelo processar_ticket.yml
- name: GLPI | Normalizar tickets
  ansible.builtin.set_fact:
    _ticket_item:
      id: "{{ item.json.id }}"
      name: "{{ item.json.name }}"
  loop: "{{ _ticket_details.results }}"
  register: _ticket_items

- name: GLPI | Consolidar
  ansible.builtin.set_fact:
    glpi_tickets: "{{ _ticket_items.results | map(attribute='ansible_facts._ticket_item') | list }}"

- name: GLPI | Debug final
  ansible.builtin.debug:
    msg: "Total para processar: {{ glpi_tickets | length }} | IDs: {{ glpi_tickets | map(attribute='id') | list }}"

