---
# Entrypoint da role glpi_openshift_correcao
# Orquestra: autenticar GLPI -> buscar tickets -> processar cada um -> fechar sessao

- name: GLPI | Iniciar sessao na API (Basic Auth)
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/initSession"
    method: GET
    headers:
      Authorization: "Basic {{ (glpi_user + ':' + glpi_pass) | b64encode }}"
    validate_certs: false
    status_code: 200
  register: glpi_session

- name: GLPI | Guardar session token
  ansible.builtin.set_fact:
    glpi_session_token: "{{ glpi_session.json.session_token }}"

- name: GLPI | Buscar tickets de vulnerabilidades (search API)
  ansible.builtin.uri:
    url: "{{ glpi_url }}/apirest.php/search/Ticket?criteria[0][field]=1&criteria[0][searchtype]=contains&criteria[0][value]={{ glpi_search_filter | urlencode }}&is_deleted=0"
    method: GET
    headers:
      Session-Token: "{{ glpi_session_token }}"
    validate_certs: false
    status_code: 200
  register: glpi_search_result

- name: GLPI | Extrair tickets do formato search
  ansible.builtin.set_fact:
    glpi_tickets: >-
      {{
        glpi_search_result.json.data | default([]) | map('combine', {}) | list
        | map('dict2items')
        | map('selectattr', 'key', 'equalto', '1')
        | map('map', attribute='value')
        | map('first')
        | list
      }}
  when: glpi_search_result.json.data is defined

# Formato correto: mapear campo "1"=nome, "2"=id
- name: GLPI | Normalizar tickets para formato padrao
  ansible.builtin.set_fact:
    glpi_tickets: >-
      {{
        glpi_search_result.json.data | default([]) | map(
          {
            'id': item['2'] | int,
            'name': item['1']
          }
        ) | list
      }}
  vars:
    item: "{{ item }}"
  loop: "{{ glpi_search_result.json.data | default([]) }}"
  register: _ticket_map

- name: GLPI | Consolidar tickets normalizados
  ansible.builtin.set_fact:
    glpi_tickets: "{{ _ticket_map.results | map(attribute='ansible_facts.glpi_tickets') | list | flatten }}"

- name: GLPI | Debug — tickets encontrados
  ansible.builtin.debug:
    msg: "Tickets filtrados: {{ glpi_tickets | map(attribute='id') | list }} (total: {{ glpi_tickets | length }})"


