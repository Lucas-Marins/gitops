---
# Processa um unico ticket de correcao de vulnerabilidades
# Variavel de entrada: 'ticket' (loop_var do include_tasks)

- name: "[Ticket {{ ticket.id }}] Extrair nome da VM e IP do titulo"
  ansible.builtin.set_fact:
    ticket_id: "{{ ticket.id }}"
    ticket_url: "{{ glpi_url }}/front/ticket.form.php?id={{ ticket.id }}"
    vm_name: "{{ ticket.name | regex_search('(?i)nome[:\\s]+([A-Za-z0-9._-]+)', '\\1') | first | default('') | trim }}"
    vm_ip: "{{ ticket.name | regex_search('(?i)IP[:\\s]+([0-9.]+)', '\\1') | first | default('') | trim }}"

- name: "[Ticket {{ ticket_id }}] Debug — dados extraidos"
  ansible.builtin.debug:
    msg: "VM: {{ vm_name }} | IP: {{ vm_ip }} | Namespace: {{ openshift_namespace }}"

- name: "[Ticket {{ ticket_id }}] Abortar se VM nao identificada"
  ansible.builtin.fail:
    msg: "Nao foi possivel extrair nome/IP do titulo: {{ ticket.name }}"
  when: vm_name | length == 0 or vm_ip | length == 0

- name: "[Ticket {{ ticket_id }}] Gerar timestamp unico para snapshot"
  ansible.builtin.set_fact:
    snapshot_ts: "{{ now(fmt='%Y%m%d%H%M%S') }}"

- name: "[Ticket {{ ticket_id }}] Montar nome do snapshot"
  ansible.builtin.set_fact:
    snapshot_name: "{{ vm_name }}-{{ snapshot_prefix | default('security') }}-{{ ticket_id }}-{{ snapshot_ts }}"

# ═══════════════════════════════════════════════════════════
# BLOCK: sucesso = follow-up + fecha ticket
# RESCUE: falha = NAO envia nada ao GLPI, so loga local
# ═══════════════════════════════════════════════════════════
- name: "[Ticket {{ ticket_id }}] Executar correcao"
  block:

    # ── 1. SNAPSHOT KUBEVIRT ──
    - name: "[Ticket {{ ticket_id }}] Criar snapshot no OpenShift Virtualization"
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: "{{ openshift_validate_certs | default(false) }}"
        state: present
        definition:
          apiVersion: "{{ snapshot_api_version }}"
          kind: VirtualMachineSnapshot
          metadata:
            name: "{{ snapshot_name }}"
            namespace: "{{ openshift_namespace }}"
          spec:
            source:
              apiGroup: kubevirt.io
              kind: VirtualMachine
              name: "{{ vm_name }}"
      register: snapshot_created

    - name: "[Ticket {{ ticket_id }}] Aguardar snapshot ficar ready"
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: "{{ openshift_validate_certs | default(false) }}"
        api_version: "{{ snapshot_api_version }}"
        kind: VirtualMachineSnapshot
        name: "{{ snapshot_name }}"
        namespace: "{{ openshift_namespace }}"
      register: snapshot_status
      until: >
        snapshot_status.resources is defined and
        snapshot_status.resources | length > 0 and
        snapshot_status.resources[0].status.readyToUse | default(false)
      retries: 30
      delay: 10

    - name: "[Ticket {{ ticket_id }}] Confirmar snapshot pronto"
      ansible.builtin.debug:
        msg: "Snapshot {{ snapshot_name }} pronto no namespace {{ openshift_namespace }}"

    # ── 2. UPDATE DE SEGURANCA ──
    - name: "[Ticket {{ ticket_id }}] dnf update --security"
      ansible.builtin.shell: |
        dnf update --security -y 2>&1
      delegate_to: "{{ vm_ip }}"
      become: "{{ vm_become }}"
      become_user: "{{ vm_become_user }}"
      register: dnf_result

    - name: "[Ticket {{ ticket_id }}] Verificar se needs-restarting existe"
      ansible.builtin.command: which needs-restarting
      delegate_to: "{{ vm_ip }}"
      become: "{{ vm_become }}"
      become_user: "{{ vm_become_user }}"
      register: needs_restarting_bin
      ignore_errors: true
      changed_when: false

    - name: "[Ticket {{ ticket_id }}] Verificar se reboot e necessario"
      ansible.builtin.command: needs-restarting -r
      delegate_to: "{{ vm_ip }}"
      become: "{{ vm_become }}"
      become_user: "{{ vm_become_user }}"
      register: reboot_required
      ignore_errors: true
      changed_when: false
      when: needs_restarting_bin.rc == 0

    - name: "[Ticket {{ ticket_id }}] Rebootar VM se necessario"
      ansible.builtin.reboot:
        reboot_timeout: "{{ vm_ssh_timeout | default(300) }}"
      delegate_to: "{{ vm_ip }}"
      become: "{{ vm_become }}"
      become_user: "{{ vm_become_user }}"
      when: reboot_required.rc | default(0) != 0
      register: reboot_done

    # ── 3. RELATORIO DE SUCESSO ──
    - name: "[Ticket {{ ticket_id }}] Formatar relatorio de sucesso"
      ansible.builtin.set_fact:
        patch_report: |
          === Correcao Automatica GLPI #{{ ticket_id }} ===
          VM OpenShift: {{ vm_name }}
          Namespace: {{ openshift_namespace }}
          IP: {{ vm_ip }}
          Snapshot: {{ snapshot_name }}
          URL: {{ ticket_url }}

          --- dnf update --security ---
          RC: {{ dnf_result.rc }}
          SUCESSO
          stdout:
          {{ dnf_result.stdout | default('N/A') }}

          Reboot necessario: {{ reboot_required.rc | default(0) != 0 }}
          Reboot realizado: {{ reboot_done is defined and reboot_done is changed }}

    # ── 4. ATUALIZAR GLPI: FOLLOW-UP + FECHAR (SO SE CHEGOU AQUI) ──
    - name: "[Ticket {{ ticket_id }}] Adicionar follow-up de SUCESSO no GLPI"
      ansible.builtin.uri:
        url: "{{ glpi_url }}/apirest.php/Ticket/{{ ticket_id }}/TicketFollowup"
        method: POST
        headers:
          Session-Token: "{{ glpi_session_token }}"
          Content-Type: "application/json"
        body:
          input:
            content: "{{ patch_report }}"
            is_private: 0
        body_format: json
        validate_certs: false
        status_code: [201, 200]

    - name: "[Ticket {{ ticket_id }}] Fechar chamado no GLPI"
      ansible.builtin.uri:
        url: "{{ glpi_url }}/apirest.php/Ticket/{{ ticket_id }}"
        method: PUT
        headers:
          Session-Token: "{{ glpi_session_token }}"
          Content-Type: "application/json"
        body:
          input:
            status: 6
            solutiontypes_id: 1
            solution: "Correcao de vulnerabilidades aplicada automaticamente via Ansible + OpenShift Virtualization. Snapshot de seguranca: {{ snapshot_name }}."
        body_format: json
        validate_certs: false
        status_code: [200]

    - name: "[Ticket {{ ticket_id }}] Resumo final — SUCESSO"
      ansible.builtin.debug:
        msg: |
          Ticket {{ ticket_id }} FECHADO com sucesso.
          VM: {{ vm_name }} | IP: {{ vm_ip }}
          Snapshot: {{ snapshot_name }}
          dnf rc: {{ dnf_result.rc }}
          Reboot: {{ reboot_done is defined and reboot_done is changed }}

  # ═══════════════════════════════════════════════════════════
  # RESCUE: falha = NAO envia NADA ao GLPI. Ticket fica intacto.
  # ═══════════════════════════════════════════════════════════
  rescue:

    - name: "[Ticket {{ ticket_id }}] Identificar falha"
      ansible.builtin.set_fact:
        _failed_task: "{{ ansible_failed_task.name | default('desconhecida') }}"
        _failed_result: "{{ ansible_failed_result | default({}) }}"

    - name: "[Ticket {{ ticket_id }}] Log local de falha — GLPI NAO foi alterado"
      ansible.builtin.debug:
        msg: |
          Ticket {{ ticket_id }} MANTIDO ABERTO (sem alteracao no GLPI).
          VM: {{ vm_name }} | IP: {{ vm_ip }}
          Task que falhou: {{ _failed_task }}
          Erro: {{ _failed_result.msg | default(_failed_result.stderr | default('N/A')) }}
          Nenhum follow-up ou fechamento foi enviado ao GLPI.