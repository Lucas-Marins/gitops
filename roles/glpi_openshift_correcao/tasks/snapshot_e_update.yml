---
# ═══════════════════════════════════════════════════════════
# JOB 2: Recebe dados do Job 1 via set_stats, cria snapshot
# e executa dnf update --security para cada ticket.
# ═══════════════════════════════════════════════════════════

- name: "Receber dados do Job 1"
  ansible.builtin.set_fact:
    _tickets_criticos: "{{ glpi_tickets_para_aprovacao }}"

- name: "Debug — tickets recebidos"
  ansible.builtin.debug:
    msg: "Tickets recebidos: {{ _tickets_criticos | length }}"

- name: "Inicializar lista de resultados"
  ansible.builtin.set_fact:
    _resultados: []

- name: "Processar cada ticket (snapshot + update)"
  ansible.builtin.include_tasks: snapshot_update_single.yml
  loop: "{{ _tickets_criticos }}"
  loop_control:
    loop_var: ticket

- name: "Passar resultados para o Job 3 via set_stats"
  ansible.builtin.set_stats:
    data:
      glpi_resultados: "{{ _resultados }}"