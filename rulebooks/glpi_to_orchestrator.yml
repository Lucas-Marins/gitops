---
- name: Receive GLPI webhook events
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ glpi_webhook_token }}"

  rules:
    - name: Receive GLPI ticket events
      condition: event.payload.source == "glpi"

      action:
        debug:
          msg: "{{ event.payload }}"
