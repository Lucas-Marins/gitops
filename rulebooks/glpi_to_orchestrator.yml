---
- name: Receive GLPI webhook events
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ glpi_webhook_token }}"

  rules:
    - name: Forward GLPI ticket events to Automation Orchestrator
      condition: event.payload.event == "new"

      action:
        run_job_template:
          name: "JT-GLPI-FORWARD-TO-ORCHESTRATOR"
          organization: "Default"
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              event_payload: "{{ event.payload }}"



