---
- name: Monitorar URL e reiniciar httpd se cair
  hosts: localhost
  sources:
    - ansible.eda.url_check:
        urls: 
         - https://vm-aap.apps.cluster-2kzb2.dyn.redhatworkshops.io/
        delay: 50
        verify_ssl: false
        
  rules:
    - name: URL fora do ar - reiniciar httpd
      condition: event.url_check.status == "down"
      action:
        run_job_template:
          name: "Restart HTTPD"
          organization: "Default"